<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Parental consent · Revivo</title>
<link rel="stylesheet" href="style.css">

<body>
<main>
<h1>Parental consent</h1>
<p>Taking you to the consent page… If nothing happens, open the link in the email again.</p>
</main>
<script>
  // The email link carries a one-time token; the page itself is served by
  // the parentConsentPage Cloud Function (functions/src/legal.ts).
  var q = location.search;
  if (/[?&][tm]=/.test(q)) location.replace('https://us-central1-revivo-recovery-app.cloudfunctions.net/parentConsentPage' + q);
</script>
</body>
